<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yan Li · Demo Homepage</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --line: #273449;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #0b1220, var(--bg));
      color: var(--text);
      line-height: 1.6;
    }
    .wrap {
      width: min(920px, 92%);
      margin: 40px auto;
      display: grid;
      gap: 16px;
    }
    .card {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
    }
    h1, h2 { margin: 0 0 10px; }
    h1 { font-size: 30px; }
    h2 { font-size: 18px; color: #dbeafe; }
    .muted { color: var(--muted); }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .btn {
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      background: #0b1322;
    }
    .btn.primary {
      border-color: #0ea5e9;
      background: #082f49;
    }
    ul {
      margin: 0;
      padding-left: 18px;
    }
    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      border: 1px solid #0ea5e9;
      border-radius: 999px;
      color: var(--accent);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1 id="name">Yan Li</h1>
      <p class="muted" id="headline">Personal Homepage · Demo Version</p>
      <p id="intro">你好，这是一版“流程验证用”的极简主页。确认流程跑通后，我可以继续升级为完整作品集风格。</p>
      <span class="badge">Flow Test Passed ✅</span>
      <div class="row">
        <a id="linkedin" class="btn primary" href="https://www.linkedin.com/in/yan-li-36780211a/" target="_blank" rel="noreferrer">LinkedIn</a>
        <a id="github" class="btn" href="https://github.com/stoudemireyan32" target="_blank" rel="noreferrer">GitHub</a>
        <a id="email" class="btn" href="mailto:you@example.com">Email</a>
      </div>
    </section>

    <section class="card">
      <h2>What I Do</h2>
      <ul id="skills"></ul>
    </section>

    <section class="card">
      <h2>Next Step</h2>
      <p class="muted">告诉我你想要的风格（比如：极简白色 / 深色科技 / 产品作品集），我会直接升级到正式版首页。</p>
    </section>
  </main>

  <script>
    const profile = {
      name: "Yan Li",
      headline: "Builder · Product · AI",
      intro: "你好，这是一版“流程验证用”的极简主页。确认流程跑通后，我可以继续升级为完整作品集风格。",
      email: "you@example.com",
      linkedin: "https://www.linkedin.com/in/yan-li-36780211a/",
      github: "https://github.com/stoudemireyan32",
      skills: ["AI / AIGC", "Product Strategy", "Growth", "Cross-functional Execution"]
    };

    const byId = (id) => document.getElementById(id);

    byId("name").textContent = profile.name;
    byId("headline").textContent = profile.headline;
    byId("intro").textContent = profile.intro;

    byId("email").href = `mailto:${profile.email}`;
    byId("linkedin").href = profile.linkedin;
    byId("github").href = profile.github;

    byId("skills").innerHTML = profile.skills.map((item) => `<li>${item}</li>`).join("");
  </script>
</body>
</html>
